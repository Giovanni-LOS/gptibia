services:
  tibiawiki-mcp:
    image: writenotenow/db-mcp:v5.0.1
    command:
      - --transport
      - http
      - --port
      - "3000"
      - --server-host
      - 0.0.0.0
      - --sqlite
      - /app/data/tibiawiki.db
      - --allowed-io-roots
      - /app/data
      - --tool-filter
      - read_query,list_tables
      - --no-auth-enforcement
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/tibiawiki.db:/app/data/tibiawiki.db:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
